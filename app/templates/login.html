<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EasyScan</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 40px;
    width: 380px;
    border-radius: 20px;
    box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.logo-box {
    width: 70px;
    height: 70px;
    background: #1565c0;
    border-radius: 18px;
    margin: auto;
    color: white;
    font-size: 40px;
    line-height: 70px;
    font-weight: bold;
}

h1 {
    color: #1565c0;
    margin-top: 20px;
    margin-bottom: 10px;
}

.subtitle {
    color: gray;
    margin-bottom: 25px;
}

input {
    width: 90%;
    padding: 14px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
}

button {
    width: 95%;
    padding: 14px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

button:hover {
    background: #0d47a1;
}

.links {
    margin-top: 20px;
}

.links a {
    color: #1565c0;
    text-decoration: none;
    font-weight: bold;
    display: block;
    margin: 8px 0;
}

.flash-message {
    color: red;
    margin-bottom: 15px;
}
</style>
</head>
<body>

<div class="container">
<div class="login-box">

<div class="logo-box">+</div>

<h1>EasyScan</h1>
<p class="subtitle">Clinical AI Assistant Login Portal</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="flash-message">
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
</div>
{% endif %}
{% endwith %}

<form method="POST" action="/login">
    <input type="email" name="email" placeholder="Enter your email" required>
    <input type="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Sign In</button>
</form>

<div class="links">
    <a href="/forgot_password">Forgot Password?</a>
    <a href="/signup">Create New Account</a>
</div>

</div>
</div>
<div style="text-align:center; margin-top: 16px; font-size: 13px; color: #888;">
    Are you a doctor? <a href="/doctor_login" style="color:#1565c0; font-weight:bold;">Doctor Login →</a>
</div>
</body>
</html>
