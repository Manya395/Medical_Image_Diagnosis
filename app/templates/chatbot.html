<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>

<style>
body {
    font-family: Arial;
    background: #eef5ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-container {
    width: 400px;
    height: 500px;
    background: white;
    border-radius: 15px;
    box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
}

.header {
    background: #1565c0;
    color: white;
    padding: 15px;
    text-align: center;
    border-radius: 15px 15px 0 0;
}

.chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.input-area {
    display: flex;
    padding: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    margin-left: 10px;
    padding: 10px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.user {
    color: black;
    margin: 5px 0;
}

.bot {
    color: #1565c0;
    margin: 5px 0;
}
</style>

</head>

<body>
    <a href="/" style="display:inline-block; margin: 15px; padding: 8px 20px; background-color: #1a56db; color: white; text-decoration: none; border-radius: 8px; font-size: 14px;">← Back to Home</a>

<div class="chat-container">

    <div class="header">AI Medical Chatbot</div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="msg" placeholder="Ask something...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
function sendMessage() {
    let input = document.getElementById("msg");
    let message = input.value.trim();

    if (message === "") return;

    let chatBox = document.getElementById("chatBox");

    // show user message
    chatBox.innerHTML += "<div class='user'><b>You:</b> " + message + "</div>";

    fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({message: message})
    })
    .then(response => response.json())
    .then(data => {
        chatBox.innerHTML += "<div class='bot'><b>AI:</b> " + data.reply + "</div>";
        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(err => {
        chatBox.innerHTML += "<div class='bot'><b>AI:</b> Error occurred</div>";
    });

    input.value = "";
}
</script>

</body>
</html>
