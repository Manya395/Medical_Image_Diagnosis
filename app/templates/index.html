<!DOCTYPE html>
<html>
<head>
<title>EasyScan AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

/* TOP NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: white;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.05);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #1565c0;
}

.nav-right a {
    margin-left: 20px;
    text-decoration: none;
    font-weight: bold;
}

.profile {
    color: #1565c0;
}

.logout {
    color: red;
}

/* MAIN CARD */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 85vh;
}

.card {
    background: white;
    padding: 40px;
    width: 400px;
    border-radius: 20px;
    box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.icon {
    width: 70px;
    height: 70px;
    background: #1565c0;
    border-radius: 18px;
    margin: auto;
    color: white;
    font-size: 40px;
    line-height: 70px;
}

h2 {
    color: #1565c0;
    margin-top: 20px;
}

.upload-box {
    margin-top: 25px;
    padding: 25px;
    border: 2px dashed #cfd8dc;
    border-radius: 15px;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0d47a1;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">EasyScan AI</div>

    <div class="nav-right">
        <a href="/profile" class="profile">Profile</a>
        <a href="/logout" class="logout">Logout</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <div class="card">

        <div class="icon">+</div>

        <h2>Upload Scan</h2>
        <p>Welcome, {{ user }}</p>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">
                <input type="file" name="file" required>
            </div>

            <button type="submit">Analyze Scan</button>

        </form>

        {% if result %}
        <h3 style="margin-top:20px;">Result: {{ result }}</h3>
        <p>Confidence: {{ confidence }}%</p>
        {% endif %}

    </div>

</div>

</body>
</html>
