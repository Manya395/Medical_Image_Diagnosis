<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EasyScan - Clinical Dashboard</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#eef4fb; min-height:100vh; display:flex; justify-content:center; align-items:center; padding: 20px; }
.container{ width:500px; background:white; border-radius:20px; box-shadow:0 12px 30px rgba(0,0,0,0.08); overflow:hidden; }
.header{ background:#f8fbff; padding:30px; text-align:center; border-bottom:1px solid #e5e7eb; }
.logo-icon{ width:60px; height:60px; background:#2563eb; border-radius:16px; display:flex; justify-content:center; align-items:center; color:white; font-size:28px; font-weight:bold; margin:0 auto 15px auto; }
.header h1{ font-size:26px; color:#1e3a8a; }
.body{ padding:35px; text-align: center; }
.upload-box{ border: 2px dashed #cbd5e1; padding: 30px; border-radius: 12px; margin-bottom: 20px; }
.btn{ width:100%; padding:15px; background:#2563eb; color:white; font-size:18px; font-weight:bold; border:none; border-radius:14px; cursor:pointer; transition:0.3s; margin-top: 10px; }
.btn:hover{ background:#1d4ed8; }
.result-box{ margin-top: 25px; padding: 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; }
.result-box h2 { color: #166534; margin-bottom: 5px; }
.links{ margin-top:20px; display: flex; justify-content: space-between; }
.links a{ text-decoration:none; color:#2563eb; font-weight:bold; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-icon">+</div>
        <h1>EasyScan AI</h1>
        <p>Welcome, {{ user }}</p>
    </div>
    <div class="body">
        <form method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="file" accept="image/*" required>
            </div>
            <button type="submit" class="btn">Analyze Scan</button>
        </form>

        {% if result %}
        <div class="result-box">
            <h2>{{ result }}</h2>
            <p>Confidence Score: {{ (confidence * 100)|round(2) }}%</p>
            {% if uploaded_image %}
            <img src="{{ url_for('static', filename=uploaded_image) }}" style="width: 100%; border-radius: 10px; margin-top: 15px;">
            {% endif %}
        </div>
        {% endif %}

        <div class="links">
            <a href="/profile">View Profile History</a>
            <a href="/logout" style="color: #dc2626;">Logout</a>
        </div>
    </div>
</div>
</body>
</html>
