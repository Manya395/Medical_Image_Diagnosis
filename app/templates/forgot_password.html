<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<style>
body{
background:#eef4fb;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.container{
width:420px;
background:white;
border-radius:20px;
box-shadow:0 12px 30px rgba(0,0,0,0.08);
overflow:hidden;
}
.header{
background:#f8fbff;
padding:30px;
text-align:center;
}
.logo{
width:60px;
height:60px;
background:#2563eb;
color:white;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
margin:auto;
margin-bottom:15px;
}
.body{
padding:35px;
}
input{
width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #cbd5e1;
border-radius:12px;
}
button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
}
a{
display:block;
text-align:center;
margin-top:18px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">+</div>
<h1>Reset Password</h1>
<p>Recover your EasyScan account</p>
</div>
<div class="body">
<form method="POST">
<input type="email" name="email" placeholder="Enter Email" required>
<input type="password" name="new_password" placeholder="New Password" required>
<button type="submit">Reset Password</button>
</form>
<a href="/login">Back to Login</a>
</div>
</div>
</body>
</html>
